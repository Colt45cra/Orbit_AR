<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061b1a"><title>ATM Palm AR</title><style>*{box-sizing:border-box}body{margin:0;background:#061b1a;color:white;font:15px system-ui}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}header{position:fixed;top:env(safe-area-inset-top,12px);left:14px;right:14px;padding-top:14px;z-index:2;display:flex;justify-content:space-between;text-shadow:0 2px 5px #000}small{display:block;font-size:10px;letter-spacing:2px;color:#8ce0d3}#info{position:fixed;top:85px;width:100%;text-align:center;text-shadow:0 2px 6px #000;z-index:2}footer{position:fixed;bottom:25px;left:8px;right:8px;display:flex;justify-content:center;gap:8px;z-index:4}button{background:#093c3b;color:white;border:1px solid #56b7aa;border-radius:28px;padding:13px 16px;font:600 13px system-ui}#overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:radial-gradient(circle,#165251,#061b1a);padding:25px;text-align:center}#overlay section{max-width:360px}#overlay h1{font-size:31px;line-height:1.06}#overlay p{line-height:1.5;color:#c9ded9}#overlay button{background:#3ae0c3;color:#09221c;font-size:17px;padding:16px 26px}#video.mirror{transform:scaleX(-1)}.off{display:none!important}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><header><div><strong>ALL THE MONEY</strong><small>OUR CORNER OF THE XRPL</small></div><strong>ATM · AR</strong></header><div id="info">Show your open palm</div><footer><button id="switch">Switch camera</button><button id="multi">Hands: 1</button><button id="spin">Intro: On</button></footer><div id="overlay"><section><div style="font-size:56px">✋</div><h1>Your ATM is in your hands.</h1><p>Open your palm toward the camera to summon a floating 3D ATM machine.</p><button id="launch">Launch Palm AR</button><p id="status">Camera required · Works best in good light</p></section></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js';
const $=s=>document.querySelector(s),v=$('#video'),info=$('#info');let stream,tracker,ready=false,facing='environment',two=false,spin=true,modelReady=false,lastVideo=-1,lastInference=0,lastLight=0;const FACE_ANGLE=0;const lightCanvas=document.createElement('canvas');lightCanvas.width=32;lightCanvas.height=18;const lightCtx=lightCanvas.getContext('2d',{willReadFrequently:true});const ren=new THREE.WebGLRenderer({canvas:$('#canvas'),alpha:true,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.setClearColor(0,0);ren.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(46,1,.01,100);cam.position.z=5;const ambient=new THREE.HemisphereLight(0xffffff,0x5c4032,3);scene.add(ambient);const lamp=new THREE.DirectionalLight(0xffe6b3,4);lamp.position.set(-2,4,5);scene.add(lamp);const g=new THREE.DirectionalLight(0x4fffff,2.5);g.position.set(2,1,-3);scene.add(g);
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const units=[0,1].map(()=>{const root=new THREE.Group(),obj=new THREE.Group();root.add(obj);scene.add(root);root.visible=false;const ring=new THREE.Mesh(new THREE.RingGeometry(.35,.43,48),new THREE.MeshBasicMaterial({color:0x49ebd4,transparent:true,opacity:.45,side:THREE.DoubleSide}));root.add(ring);return {root,obj,ring,p:new THREE.Vector3(),dest:new THREE.Vector3(),scale:0,want:1,last:0,initialized:false,introAt:0,roll:0,pitch:0,yaw:0,goalRoll:0,goalPitch:0,goalYaw:0}});
async function loadModel(){const r=await fetch('./model.b64');if(!r.ok)throw Error('Model download failed');const raw=(await r.text()).trim();const bin=atob(raw),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const item=await new Promise((yes,no)=>loader.parse(bytes.buffer,'',yes,no));const obj=item.scene,box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),mid=box.getCenter(new THREE.Vector3());const scale=1.05/Math.max(size.x,size.y,size.z);obj.scale.setScalar(scale);obj.position.copy(mid).multiplyScalar(-scale);for(const u of units)u.obj.add(obj.clone(true));modelReady=true;info.textContent='Show your open palm'}
loadModel().catch(e=>{console.error(e);info.textContent='3D model error: '+e.message});
async function cameraStart(){stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();v.classList.toggle('mirror',facing==='user');lastVideo=-1}
async function handStart(){const {FilesetResolver,HandLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/wasm');const o={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.6,minHandPresenceConfidence:.6,minTrackingConfidence:.55};try{return await HandLandmarker.createFromOptions(files,o)}catch(e){o.baseOptions.delegate='CPU';return HandLandmarker.createFromOptions(files,o)}}
$('#launch').onclick=async()=>{const b=$('#launch');b.disabled=true;$('#status').textContent='Starting camera…';try{await cameraStart();$('#status').textContent='Loading hand recognition…';tracker=await handStart();ready=true;$('#overlay').classList.add('off');info.textContent='Show your open palm'}catch(e){$('#status').textContent=e.message;b.disabled=false}};
$('#switch').onclick=async()=>{facing=facing==='environment'?'user':'environment';try{await cameraStart()}catch(e){info.textContent=e.message}};
$('#multi').onclick=e=>{two=!two;e.target.textContent='Hands: '+(two?'2':'1')};$('#spin').onclick=e=>{spin=!spin;for(const u of units)u.introAt=performance.now();e.target.textContent='Intro: '+(spin?'On':'Off')};
function pixel(p){const vw=v.videoWidth||innerWidth,vh=v.videoHeight||innerHeight,z=Math.max(innerWidth/vw,innerHeight/vh);let x=p.x*vw*z-(vw*z-innerWidth)/2,y=p.y*vh*z-(vh*z-innerHeight)/2;if(facing==='user')x=innerWidth-x;return {x,y}}
function world(p){const hh=10*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)),ww=hh*cam.aspect;return new THREE.Vector3((p.x/innerWidth-.5)*ww,(.5-p.y/innerHeight)*hh,0)}
function process(res,now){let found=[];for(const lm of res.landmarks||[]){const a=pixel(lm[5]),b=pixel(lm[17]),m=pixel(lm[9]),w=pixel(lm[0]),tip=pixel(lm[12]);const span=Math.hypot(a.x-b.x,a.y-b.y);if(span<18||Math.hypot(tip.x-w.x)<Math.hypot(m.x-w.x)*.9)continue;const p={x:(a.x+b.x+m.x+w.x)/4,y:(a.y+b.y+m.y+w.y)/4-Math.max(65,span*.95)};const roll=Math.atan2(b.y-a.y,b.x-a.x);const pitch=THREE.MathUtils.clamp((Math.abs(m.y-w.y)/Math.max(1,span)-.65)*.6,-.45,.45);const yaw=THREE.MathUtils.clamp((lm[17].z-lm[5].z)*2.2,-.75,.75);found.push({p:world(p),scale:Math.min(1.7,Math.max(.5,span/130)),span,roll:THREE.MathUtils.clamp(roll,-1.1,1.1),pitch,yaw})}found.sort((a,b)=>b.span-a.span);found=found.slice(0,two?2:1);for(const u of units){if(!found.length)break;let best=0;if(u.initialized&&found.length>1&&u.p.distanceTo(found[1].p)<u.p.distanceTo(found[0].p))best=1;const x=found.splice(best,1)[0];u.dest.copy(x.p);u.want=x.scale;u.goalRoll=x.roll;u.goalPitch=x.pitch;u.goalYaw=x.yaw;u.last=now;if(!u.initialized){u.p.copy(x.p);u.scale=.02;u.initialized=true;u.introAt=now}}info.textContent=units.some(u=>now-u.last<350)?'ATM tracking':'Move your palm to explore'}
const timer=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=timer.getElapsedTime(),now=performance.now();if(ready&&tracker&&modelReady&&v.readyState>=2&&v.currentTime!==lastVideo&&now-lastInference>30){lastVideo=v.currentTime;lastInference=now;try{process(tracker.detectForVideo(v,now),now)}catch(e){console.error(e)}}for(const u of units){const live=ready&&now-u.last<450,linger=ready&&now-u.last<1100;u.scale=THREE.MathUtils.lerp(u.scale,live?u.want:0,live?.15:.11);if(live)u.p.lerp(u.dest,.52);u.root.visible=modelReady&&linger&&u.scale>.04;u.root.position.copy(u.p);u.root.position.y+=Math.sin(t*2.4)*.045;u.root.scale.setScalar(u.scale);u.obj.position.y=.73;const introTime=(now-u.introAt)/1000;const progress=Math.min(1,Math.max(0,introTime/1.15));const ease=1-Math.pow(1-progress,3);u.roll=THREE.MathUtils.lerp(u.roll,u.goalRoll,.32);u.pitch=THREE.MathUtils.lerp(u.pitch,u.goalPitch,.24);u.yaw=THREE.MathUtils.lerp(u.yaw,u.goalYaw,.25);u.obj.rotation.set(u.pitch,FACE_ANGLE+u.yaw+(spin?Math.PI*2*(1-ease):0),u.roll,'YXZ');u.ring.material.opacity=.35+.15*Math.sin(t*3);if(!linger)u.initialized=false}if(ready&&v.readyState>=2&&now-lastLight>350){lastLight=now;try{lightCtx.drawImage(v,0,0,32,18);const pix=lightCtx.getImageData(0,0,32,18).data;let r=0,gr=0,b=0,n=0;for(let i=0;i<pix.length;i+=16){const rr=pix[i],gg=pix[i+1],bb=pix[i+2],lum=.2126*rr+.7152*gg+.0722*bb;if(lum>12&&lum<245){r+=rr;gr+=gg;b+=bb;n++}}if(n){r/=n;gr/=n;b/=n;const lum=(.2126*r+.7152*gr+.0722*b)/255;const brightness=THREE.MathUtils.clamp(.45+lum*1.9,.55,1.65);ambient.intensity=2.2*brightness;lamp.intensity=2.4*brightness;g.intensity=.8*brightness;g.color.setRGB(THREE.MathUtils.clamp(r/175,.45,1),THREE.MathUtils.clamp(gr/175,.45,1),THREE.MathUtils.clamp(b/175,.45,1));ren.toneMappingExposure=THREE.MathUtils.clamp(.65+lum*.85,.72,1.2)}}catch(e){}}ren.render(scene,cam)}animate();
</script></body></html>
